<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>冒险地图 · 作品集</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- 全局 Loading -->
<div id="loading" class="loading active">
  <div class="loading-scroll"></div>
  <div class="loading-text">加载中…</div>
</div>

<!-- 地图页 -->
<section id="map" class="page">
  <img src="assets/01.png" class="map-bg" alt="地图" />
  <div class="landmarks" id="landmarks"></div>
  <button id="reset-btn" class="reset-btn">🔄 重新探索</button>
  <div id="goldFlash" class="gold-flash"></div>
</section>

<!-- 作品页浮层 -->
<section id="work" class="page hidden">
  <div class="work-bg"></div>
  <div class="work-container" id="work-container">
    <button class="close-btn" id="close-btn">✖</button>
    <img id="work-img" src="" alt="作品" />
    <button class="nav-btn prev-btn" id="prev-btn">◀ 上一页</button>
    <button class="nav-btn next-btn pulse-glow" id="next-btn">下一页 ▶</button>
    <!-- 完成按钮处的手部指引（仅 1.png 显示，尺寸/位置由 JS 计算） -->
    <img id="hand-finish" class="hand-finish hidden" src="assets/handclick.svg" alt="" />
  </div>
  <canvas id="confetti"></canvas>
</section>

<script src="js/main.js"></script>
</body>
</html>
